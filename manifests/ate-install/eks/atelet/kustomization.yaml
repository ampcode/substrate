# atelet for Amazon EKS: no GCP credentials for image pulls, and the S3
# snapshot backend pointed at Amazon S3 itself. The bucket's region comes from
# the ate-aws-config ConfigMap (hack/install-ate.sh creates it from
# ATE_AWS_REGION); the credentials come from IRSA: the installer annotates the
# atelet ServiceAccount with eks.amazonaws.com/role-arn, and EKS's pod identity
# webhook then projects a web identity token and sets AWS_ROLE_ARN and
# AWS_WEB_IDENTITY_TOKEN_FILE on every atelet pod, which the SDK's default
# credential chain in cmd/atelet uses. Nothing here names the account or role.

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../atelet.yaml

patches:
  - patch: |-
      apiVersion: apps/v1
      kind: DaemonSet
      metadata:
        name: atelet
        namespace: ate-system
      spec:
        template:
          spec:
            containers:
            - name: atelet
              args:
              - --gcp-auth-for-image-pulls=false
              - --grpc-server-cred-bundle=/run/podidentity.podcert.ate.dev/credential-bundle.pem
              - --client-ca-certs=/run/podidentity.podcert.ate.dev/trust-bundle.pem
              - --ateapi-ca-file=/run/servicedns.podcert.ate.dev/trust-bundle.pem
              - --drain-delay=0s
              - --drain-timeout=5m
              env:
              - name: ATE_STORAGE_BACKEND
                value: s3
              - name: AWS_REGION
                valueFrom:
                  configMapKeyRef:
                    name: ate-aws-config
                    key: region

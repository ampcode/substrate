# eks: the control plane for an Amazon EKS cluster. Like the aks overlay it is
# the GKE base with the Google-specific pieces swapped out:
#
#   - snapshots go to an Amazon S3 bucket: the objectstore-plugin sidecars of
#     atelet and ate-api-server (which hold all object storage settings; the
#     main containers have none) run with ATE_STORAGE_BACKEND=s3 and
#     authenticate with IAM Roles for Service Accounts (the AWS SDK default
#     credential chain picks up the web identity token the EKS pod identity
#     webhook projects once the ServiceAccount carries the
#     eks.amazonaws.com/role-arn annotation), so no access keys exist anywhere
#     in the cluster. Whoever installs the overlay sets the annotation on both
#     ServiceAccounts and creates the ate-aws-config ConfigMap naming the
#     bucket's region, see ./atelet;
#   - atelet pulls images from Amazon ECR with the node's own kubelet
#     credential provider (ecr-credential-provider), mounted from EKS's paths
#     instead of GKE's (./atelet);
#   - telemetry goes to the small in-cluster OTLP collector the kind overlay
#     ships instead of GKE's managed collector; the GKE PodMonitoring for the
#     router is left out for the same reason;
#   - the in-cluster Postgres from ../postgres backs ate-api; it uses the
#     cluster's default StorageClass (create a gp3 one and mark it default on
#     clusters that have none, such as EKS Auto Mode);
#   - everything else is the base manifest, unchanged.
#
# Certificates: EKS 1.34-1.36 do not serve certificates.k8s.io/v1beta1, so
# layer ../components/agent-pki on top of this overlay, which delivers
# certificates through the podcertificate-controller's issuer API instead.
#
# Nodes: the gVisor worker is unprivileged but runsc maps identities in a user
# namespace, so worker nodes need user namespaces enabled
# (user.max_user_namespaces > 0). Amazon Linux 2023 managed node groups
# qualify; EKS Auto Mode's Bottlerocket nodes do not (they set it to 0), so
# run the tainted ate.dev/sandboxClass=gvisor worker pool on a managed node
# group and keep the control plane on whatever nodes the cluster has.
#
# cmd/ate-setup does not know this overlay; it is rendered with kustomize by
# whatever installs Substrate on EKS (`ate-setup bootstrap` creates the
# namespace, CA pools and apiconfig ConfigMap it expects).

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../ate-api-server.yaml
  - ../ate-idp-server.yaml
  - ../ate-controller.yaml
  - ./atelet
  - ../atenet-router.yaml
  - ../ate-system-networkpolicies.yaml
  - ../postgres/postgres.yaml
  - ../pod-certificate-controller.yaml
  - ../kind/ate-otel-config.yaml
  - ../kind/otel-collector.yaml

patches:
  # ate-idp-server requires --issuer, which cmd/ate-setup injects from its
  # config when it renders the base. Without ate-setup, pin it to the default
  # `ate-setup bootstrap` writes into the apiconfig ConfigMap as
  # ATE_API_ACTOR_JWT_ISSUER (internal/installdefaults.ActorJWTIssuer); the two
  # must match or relying parties reject actor JWTs.
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: ate-idp-server
      namespace: ate-system
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --issuer=https://idp.ate-system.svc
  # ate-api copies and deletes external snapshots on the same backend atelet
  # writes them through; see ./atelet for where the region and the
  # credentials come from. initContainers merges on name, so only the env is
  # added to the objectstore-plugin sidecar.
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: ate-api-server
        namespace: ate-system
      spec:
        template:
          spec:
            initContainers:
            - name: objectstore-plugin
              env:
              - name: ATE_STORAGE_BACKEND
                value: s3
              - name: AWS_REGION
                valueFrom:
                  configMapKeyRef:
                    name: ate-aws-config
                    key: region

# aks: the control plane for an Azure AKS cluster. It is the GKE base with the
# Google-specific pieces swapped out:
#
#   - snapshots go to Azure Blob Storage; atelet and ate-api authenticate with
#     Azure Workload Identity (the AKS webhook projects a federated token into
#     pods labelled azure.workload.identity/use whose ServiceAccount carries
#     the azure.workload.identity/client-id annotation, and the Azure SDK's
#     default credential chain picks it up), so no access keys exist anywhere
#     in the cluster. Whoever installs the overlay sets the annotation on both
#     ServiceAccounts and creates the ate-azure-config ConfigMap naming the
#     storage account, see ./atelet;
#   - atelet pulls images without GCP credentials (./atelet);
#   - telemetry goes to the small in-cluster OTLP collector the kind overlay
#     ships instead of GKE's managed collector, so components do not spend
#     their time failing to export;
#   - the in-cluster Postgres from ../postgres backs ate-api; it uses the
#     cluster's default StorageClass;
#   - everything else is the base manifest, unchanged.
#
# Certificates: AKS 1.34-1.36 do not serve certificates.k8s.io/v1beta1, so
# layer ../components/agent-pki on top of this overlay, which delivers
# certificates through the podcertificate-controller's issuer API instead.
#
# cmd/ate-setup does not know this overlay; it is rendered with kustomize by
# whatever installs Substrate on AKS.

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../ate-api-server.yaml
  - ../ate-controller.yaml
  - ./atelet
  - ../atenet-router.yaml
  - ../postgres/postgres.yaml
  - ../pod-certificate-controller.yaml
  - ../kind/ate-otel-config.yaml
  - ../kind/otel-collector.yaml

patches:
  # ate-api copies and deletes external snapshots on the same backend atelet
  # writes them through; see ./atelet for where the storage account and the
  # credentials come from.
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: ate-api-server
        namespace: ate-system
      spec:
        template:
          metadata:
            labels:
              azure.workload.identity/use: "true"
          spec:
            containers:
            - name: ate-api-server
              env:
              - name: ATE_STORAGE_BACKEND
                value: azblob
              - name: AZURE_STORAGE_ACCOUNT
                valueFrom:
                  configMapKeyRef:
                    name: ate-azure-config
                    key: storageAccount

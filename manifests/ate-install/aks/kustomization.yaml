# aks: the control plane for an Azure AKS cluster. It is the GKE base with the
# Google-specific pieces swapped out:
#
#   - snapshots go to Azure Blob Storage; atelet authenticates with Azure
#     Workload Identity (the AKS webhook projects a federated token into pods
#     labelled azure.workload.identity/use whose ServiceAccount carries the
#     azure.workload.identity/client-id annotation, and the Azure SDK's default
#     credential chain picks it up), so no access keys exist anywhere in the
#     cluster. hack/install-ate.sh sets the annotation from
#     ATE_AKS_ATELET_CLIENT_ID and the storage account from
#     ATE_AZURE_STORAGE_ACCOUNT (ConfigMap ate-azure-config), see ./atelet;
#   - atelet pulls images without GCP credentials (./atelet);
#   - telemetry goes to the small in-cluster OTLP collector the kind overlay
#     ships instead of GKE's managed collector, so components do not spend
#     their time failing to export;
#   - everything else is the base manifest, unchanged.
#
# Certificates: clusters like AKS 1.34-1.36 do not serve
# certificates.k8s.io/v1beta1, so install with --pki-delivery=agent, which
# layers components/agent-pki on top of this overlay.

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../ate-api-server.yaml
  - ../ate-controller.yaml
  - ./atelet
  - ../atenet-dns.yaml
  - ../atenet-router.yaml
  - ../postgres.yaml
  - ../pod-certificate-controller.yaml
  - ../kind/ate-otel-config.yaml
  - ../kind/otel-collector.yaml

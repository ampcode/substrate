# aks: the control plane for a cluster that is not on Google Cloud (AKS, EKS,
# any conformant Kubernetes). It is the GKE base with three substitutions:
#
#   - snapshots go to an in-cluster S3 store (rustfs, from the kind overlay
#     but with a disk-backed claim sized for real snapshots) instead of GCS,
#     and atelet pulls images without GCP credentials (./atelet);
#   - telemetry goes to the small in-cluster OTLP collector the kind overlay
#     ships instead of GKE's managed collector, so components do not spend
#     their time failing to export;
#   - everything else is the base manifest, unchanged.
#
# Certificates: clusters like AKS 1.34-1.36 do not serve
# certificates.k8s.io/v1beta1, so install with --pki-delivery=agent, which
# layers components/agent-pki on top of this overlay.

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../ate-api-server.yaml
  - ../ate-controller.yaml
  - ./atelet
  - ../atenet-dns.yaml
  - ../atenet-router.yaml
  - ../postgres.yaml
  - ../pod-certificate-controller.yaml
  - ../kind/ate-otel-config.yaml
  - ../kind/otel-collector.yaml
  - ./rustfs.yaml

# atelet for Azure AKS: no GCP credentials for image pulls, and the Azure Blob
# snapshot backend. The storage account comes from the ate-azure-config
# ConfigMap (hack/install-ate.sh creates it from ATE_AZURE_STORAGE_ACCOUNT); the
# credentials come from Workload Identity: the installer annotates the atelet
# ServiceAccount with azure.workload.identity/client-id, and the pod label below
# makes the AKS webhook project a federated token and set AZURE_CLIENT_ID,
# AZURE_TENANT_ID and AZURE_FEDERATED_TOKEN_FILE on every atelet pod, which the
# SDK's default credential chain in cmd/atelet uses. Nothing here names the
# subscription, identity or account.

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../atelet.yaml

patches:
  - patch: |-
      apiVersion: apps/v1
      kind: DaemonSet
      metadata:
        name: atelet
        namespace: ate-system
      spec:
        template:
          metadata:
            labels:
              azure.workload.identity/use: "true"
          spec:
            containers:
            - name: atelet
              args:
              - --gcp-auth-for-image-pulls=false
              - --grpc-server-cred-bundle=/run/podidentity.podcert.ate.dev/credential-bundle.pem
              - --client-ca-certs=/run/podidentity.podcert.ate.dev/trust-bundle.pem
              - --ateapi-ca-file=/run/servicedns.podcert.ate.dev/trust-bundle.pem
              - --drain-delay=0s
              - --drain-timeout=5m
              env:
              - name: ATE_STORAGE_BACKEND
                value: azblob
              - name: AZURE_STORAGE_ACCOUNT
                valueFrom:
                  configMapKeyRef:
                    name: ate-azure-config
                    key: storageAccount

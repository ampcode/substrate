                - serviceAccountToken:
                    audience: podcert.ate.dev
                    expirationSeconds: 3600
                    path: token
            - name: podcert-trust
              configMap:
                name: podcert-trust-bundles
            - name: servicedns
              emptyDir:
                medium: Memory
            - name: podidentity
              emptyDir:
                medium: Memory
            - name: servicedns-ca
              emptyDir:
                medium: Memory

  # ---- postgres: servicedns (cert, 0640 for PostgreSQL), podidentity-ca
  # (trust). The agent must be the first init container so tls-reloader,
  # which hashes these files with `set -e`, finds them on its first pass.
  - target:
      group: apps
      version: v1
      kind: StatefulSet
      name: postgres
      namespace: ate-system
    patch: |-
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: postgres
        namespace: ate-system
      spec:
        template:
          spec:
            volumes:
            - name: servicedns
              $patch: delete
            - name: podidentity-ca
              $patch: delete
  - target:
      group: apps
      version: v1
      kind: StatefulSet
      name: postgres
      namespace: ate-system
    patch: |-
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: postgres
        namespace: ate-system
      spec:
        template:
          spec:
            volumes:
            - name: podcert-token
              projected:
                sources:
                - serviceAccountToken:
                    audience: podcert.ate.dev
                    expirationSeconds: 3600
                    path: token
            - name: podcert-trust
              configMap:
                name: podcert-trust-bundles
            - name: servicedns
              emptyDir:
                medium: Memory
            - name: podidentity-ca
              emptyDir:
                medium: Memory
  - target:
      group: apps
      version: v1
      kind: StatefulSet
      name: postgres
      namespace: ate-system
    patch: |-
      - op: add
        path: /spec/template/spec/initContainers/0
        value:
          name: podcert-agent
          restartPolicy: Always
          image: ko://github.com/agent-substrate/substrate/cmd/podcert-agent
          args:
          # root:postgres 0640 via the pod's fsGroup, the only shared mode
          # PostgreSQL accepts for ssl_key_file.
          - --file-mode=0640
          - --cert=servicedns.podcert.ate.dev/identity=/out/servicedns
          - --trust=podidentity.podcert.ate.dev/identity=/out/podidentity-ca
          startupProbe:
            exec:
              command:
              - /ko-app/podcert-agent
              - --check
              - --cert=servicedns.podcert.ate.dev/identity=/out/servicedns
              - --trust=podidentity.podcert.ate.dev/identity=/out/podidentity-ca
            periodSeconds: 1
            failureThreshold: 300
          volumeMounts:
          - name: podcert-token
            mountPath: /var/run/secrets/podcert.ate.dev
            readOnly: true
          - name: podcert-trust
            mountPath: /run/podcert-trust
            readOnly: true
          - name: servicedns
            mountPath: /out/servicedns
          - name: podidentity-ca
            mountPath: /out/podidentity-ca
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
